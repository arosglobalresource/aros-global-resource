media:
  input: media
  output: /media

content:
  - name: website
    label: Website AROS
    type: file
    path: data/website.json
    format: json
    fields:
      - name: company_name
        label: Nama Perusahaan
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: director
        label: Direktur
        type: string
      - name: email
        label: Email Perusahaan
        type: string
      - name: address
        label: Alamat Perusahaan
        type: text
      - name: about
        label: Tentang AROS
        type: rich-text
      - name: vision
        label: Visi
        type: text
      - name: mission
        label: Misi
        type: rich-text
          - name: products
    label: Produk
    type: collection
    path: content/products
    format: json
    filename: "{primary}.json"
    fields:
      - name: name
        label: Nama Produk
        type: string
        required: true
      - name: description
        label: Deskripsi Produk
        type: text
      - name: specifications
        label: Spesifikasi
        type: rich-text
      - name: packaging
        label: Kemasan
        type: string
      - name: image
        label: Foto Produk
        type: image
